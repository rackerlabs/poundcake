suite: startup-order-jobs
templates:
  - templates/poundcake-startup-jobs.yaml
tests:
  - it: renders the PoundCake startup job sequence
    asserts:
      - hasDocuments:
          count: 8
      - equal:
          path: metadata.name
          value: poundcake-mariadb-ready
        documentIndex: 0
      - equal:
          path: metadata.name
          value: poundcake-mariadb-users
        documentIndex: 1
      - equal:
          path: metadata.name
          value: poundcake-legacy-schema-migrate
        documentIndex: 2
      - equal:
          path: metadata.name
          value: poundcake-bootstrap-schema
        documentIndex: 3
      - equal:
          path: metadata.name
          value: poundcake-mariadb-grants
        documentIndex: 4
      - equal:
          path: metadata.name
          value: poundcake-bootstrap-plugin-registry
        documentIndex: 5
      - equal:
          path: metadata.name
          value: poundcake-bootstrap-service-identity
        documentIndex: 6
      - equal:
          path: metadata.name
          value: poundcake-bootstrap-adapter-credentials
        documentIndex: 7
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
          documentIndex: 0
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
        documentIndex: 2
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
        documentIndex: 4
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
        documentIndex: 5
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
        documentIndex: 6
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
        documentIndex: 7

  - it: runs the legacy schema migration stage between users and bootstrap-schema
    documentSelector:
      path: metadata.name
      value: poundcake-legacy-schema-migrate
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "23"
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /bin/bash
            - /scripts/legacy-schema-migrate.sh
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEGACY_BACKUP_DIR
            value: /backup
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: legacy-backup
            mountPath: /backup
      - contains:
          path: spec.template.spec.volumes
          content:
            name: legacy-backup
            persistentVolumeClaim:
              claimName: poundcake-legacy-backup

  - it: runs the schema bootstrap stage with its isolated persona
    documentSelector:
      path: metadata.name
      value: poundcake-bootstrap-schema
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "api.scripts.bootstrap_schema"

  - it: runs the plugin registry bootstrap stage with its isolated persona
    documentSelector:
      path: metadata.name
      value: poundcake-bootstrap-plugin-registry
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "api.scripts.bootstrap_plugin_registry"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_ENABLED_PLUGINS
            value: dummy

  - it: runs the service identity bootstrap stage with its isolated persona
    documentSelector:
      path: metadata.name
      value: poundcake-bootstrap-service-identity
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "api.scripts.bootstrap_service_identities"

  - it: runs the adapter credential bootstrap stage with its isolated persona
    documentSelector:
      path: metadata.name
      value: poundcake-bootstrap-adapter-credentials
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "api.scripts.bootstrap_adapter_credentials"
      - equal:
          path: spec.template.spec.serviceAccountName
          value: poundcake-startup

  - it: disables Kubernetes service environment variable injection
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 0
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 1
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 2
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 3
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 4
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 5
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 6
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
        documentIndex: 7

  - it: applies startup image and pull-secret wiring to the schema job
    set:
      poundcakeImage.repository: example/poundcake
      poundcakeImage.tag: test
      poundcakeImage.pullSecrets:
        - name: regcred
    documentSelector:
      path: metadata.name
      value: poundcake-bootstrap-schema
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example/poundcake:test
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: regcred

  - it: allows startup hook ttl override
    set:
      startupHooks.cleanup.ttlSecondsAfterFinished: 60
    asserts:
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 60
        documentIndex: 0
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 60
        documentIndex: 2
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 60
        documentIndex: 4
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 60
        documentIndex: 5
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 60
        documentIndex: 7

  - it: injects monitoring backend urls only into plugin-registry and adapter-credential bootstrap stages
    set:
      monitoring.enabled: true
      monitoring.prometheus.url: http://prometheus.example.test:9090
      monitoring.prometheus.crdNamespace: monitoring
      monitoring.alertmanager.url: http://alertmanager.example.test:9093
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PROMETHEUS_URL
            value: http://prometheus.example.test:9090
        documentIndex: 5
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_ALERTMANAGER_URL
            value: http://alertmanager.example.test:9093
        documentIndex: 5
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PROMETHEUS_CRD_NAMESPACE
            value: monitoring
        documentIndex: 5
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PROMETHEUS_URL
            value: http://prometheus.example.test:9090
        documentIndex: 7
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_ALERTMANAGER_URL
            value: http://alertmanager.example.test:9093
        documentIndex: 7
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PROMETHEUS_CRD_NAMESPACE
            value: monitoring
        documentIndex: 7

  - it: isolates bootstrap encryption keys and startup database users by stage
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PLUGIN_REGISTRY_USER
            valueFrom:
              secretKeyRef:
                name: poundcake-secrets
                key: DB_PLUGIN_REGISTRY_USER
        documentIndex: 5
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 5
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 5
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_SERVICE_IDENTITY_MANAGER_USER
            valueFrom:
              secretKeyRef:
                name: poundcake-secrets
                key: DB_SERVICE_IDENTITY_MANAGER_USER
        documentIndex: 6
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: poundcake-secrets
                key: SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 6
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 6
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_CREDENTIAL_MANAGER_USER
            valueFrom:
              secretKeyRef:
                name: poundcake-secrets
                key: DB_CREDENTIAL_MANAGER_USER
        documentIndex: 7
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_PLUGIN_CREDENTIAL_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: poundcake-secrets
                key: PLUGIN_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 7
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POUNDCAKE_SERVICE_IDENTITY_CREDENTIAL_ENCRYPTION_KEY
        documentIndex: 7
