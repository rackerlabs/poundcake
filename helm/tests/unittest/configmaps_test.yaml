suite: configmaps
templates:
  - templates/poundcake-configmaps.yaml
tests:
  - it: renders PoundCake configmaps
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: poundcake-scripts
        documentIndex: 0

  - it: includes expected config data entries
    asserts:
      - isNotNull:
          path: data["mariadb-init.sh"]
        documentIndex: 0
      - isNotNull:
          path: data["legacy-schema-migrate.sh"]
        documentIndex: 0
      - matchRegex:
          path: data["legacy-schema-migrate.sh"]
          pattern: '^#!/bin/bash\nset -euo pipefail'
        documentIndex: 0
